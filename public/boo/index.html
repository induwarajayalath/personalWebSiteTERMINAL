<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link rel="stylesheet" href="/boo/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="container">
        <div id="valentines-card" class="card">
            <div class="image-container">
                <img src="/boo/bear.png" alt="Cute Bear" class="main-image">
            </div>
            <h1 class="question">Hi K, will you be my valentine?</h1>
            <div class="button-container">
                <button id="yes-btn" class="btn yes">Yes</button>
                <button id="no-btn" class="btn no">No</button>
            </div>
            <p class="footer-text">"No?" හෙහ්, හිතන් ඇති 😈</p>
        </div>

        <div id="success-state" class="success-card hidden">
            <img src="/boo/success.png" alt="Celebration" class="success-image">
            <h1 class="success-text">Yay!🙈 <br>See you on Valentine's Day angel❤️</h1>
        </div>
    </div>
    <script src="/boo/script.js"></script>
</body>

</html>
